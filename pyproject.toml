[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-account-manager"
version = "3.0.3"
description = "Switchboard multi-account manager for AI coding CLIs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ezhoon"}
]
keywords = ["ai", "claude", "codex", "grok", "gemini", "account", "switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/lee-ji-hoon/ai-account-switcher"
Repository = "https://github.com/lee-ji-hoon/ai-account-switcher"
Issues = "https://github.com/lee-ji-hoon/ai-account-switcher/issues"

[project.scripts]
claude-account = "claude_account_manager:main"
account = "claude_account_manager:main"
claude-launch = "claude_account_manager.commands.launch_cmd:cmd_launch"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_account_manager*"]
